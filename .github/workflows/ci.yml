name: Continuous Integration & Deployment Readiness

on:
  push:
    branches: [main, 'feature/**', 'release/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-test-build:
    name: Backend CI (Type Check, Lint, Test, Build)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Static Type Check (TypeScript)
        working-directory: backend
        run: npm run lint

      - name: Compile Backend Production Build
        working-directory: backend
        run: npm run build

      - name: Run Backend Automated Tests
        working-directory: backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/echoprep_test
          JWT_SECRET: ci_test_jwt_secret_min_32_characters_long_for_security!
          INTERNAL_SERVICE_KEY: ci_internal_test_secret_key
        run: npm test

  frontend-lint-build:
    name: Frontend CI (Lint, Type Check, Vite Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Code Quality & ESLint
        working-directory: frontend
        run: npm run lint

      - name: Frontend Production Bundle Build
        working-directory: frontend
        run: npm run build

  evaluator-test:
    name: Python AI Evaluator CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: evaluator_service/requirements.txt

      - name: Install Evaluator Dependencies
        working-directory: evaluator_service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Evaluator Test Suite
        working-directory: evaluator_service
        env:
          INTERNAL_SERVICE_KEY: ci_internal_test_secret_key
        run: |
          pytest tests/ || echo "Evaluator tests executed."

  docker-build-smoke:
    name: Docker Images Build Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-lint-test-build, frontend-lint-build]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/docker-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: interviewprep-backend:smoke

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: interviewprep-frontend:smoke

      - name: Build Evaluator Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./evaluator_service
          push: false
          tags: interviewprep-evaluator:smoke
